# This is the version for the readthedocs configuration. Version 2 ignores
# web-based configuration and uses everything from this file.
version: 2
# Doc builds will fail if there are any warnings
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# Configure the python version and environment construction run before
# docs are built.
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
python:
  install:
      # Install the project itself. The 4.2.0+ metapackage ships no code, but
      # pip-installing it triggers setuptools_scm to write
      # src/vivarium/_version.py, and pulls in vivarium-engine (which provides
      # the runtime deps autodoc needs).
    - method: pip
      path: .
      # Sphinx build dependencies for the legacy docs (in-tree src/ layout).
    - requirements: docs/requirements.txt
